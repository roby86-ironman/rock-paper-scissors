<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Rock, Paper, Scissors against the Evil AI.">
    <title>Rock, Paper, Scissors vs Evil AI</title>
</head>

<body>

    <!--
        ROCK, PAPER, SCISSORS - GROUP PROJECT

        TEAM TASKS:
        - ROBERTO: game() function, scores, game loop and final winner.
        - SIRAJ: player input, validation and Cancel handling.
        - JEHOSUE: computerPlay() and playRound() functions.

        The page intentionally has no visible interface.
        The player interacts through browser dialogs.
        Round results and scores appear in the browser console.
    -->

    <script>

        /*
        ============================================================
        SIRAJ'S SECTION: PLAYER INPUT
        ============================================================

        TODO FOR SIRAJ:
        1. Review and complete getPlayerSelection().
        2. Ask the player to enter Rock, Paper or Scissors.
        3. Accept uppercase and lowercase letters.
        4. Remove unnecessary spaces from the input.
        5. If the input is invalid, display an error and ask again.
        6. If the player presses Cancel, return null.

        REQUIRED RETURN VALUES:
        "Rock", "Paper", "Scissors", or null.
        */

        function getPlayerSelection() {

            while (true) {

                const answer = prompt(
                    "Choose Rock, Paper or Scissors:"
                );

                // Stop safely if the player presses Cancel.
                if (answer === null) {
                    return null;
                }

                const choice = answer.trim().toLowerCase();

                if (choice === "rock") {
                    return "Rock";
                }

                if (choice === "paper") {
                    return "Paper";
                }

                if (choice === "scissors") {
                    return "Scissors";
                }

                alert(
                    'Invalid choice! Please enter "Rock", "Paper" or "Scissors".'
                );
            }
        }


        /*

        JEHOSUE'S SECTION: COMPUTER CHOICE

        Reviewed & Completed by: Jehosue
        Function: computerPlay()
        Randomly selects and returns "Rock", "Paper", or "Scissors".

        REQUIRED RETURN VALUES:
        "Rock", "Paper" or "Scissors".
        */

        const CHOICES = Object.freeze(["Rock", "Paper", "Scissors"]);

        function computerPlay() {
            return CHOICES[Math.floor(Math.random() * CHOICES.length)];
        }


        /*

        JEHOSUE'S SECTION: ROUND LOGIC


        Reviewed & Completed by: Jehosue
        Function: playRound(playerSelection, computerSelection)

        Evaluates the round outcome according to Rock, Paper, Scissors rules.
        Uses recursive normalization to safely handle mixed casing & whitespace,
        and an O(1) rule lookup table to determine the winner cleanly.

        REQUIRED RETURN VALUES:
        "player"   = the player wins.
        "computer" = the computer wins.
        "draw"     = both choices are equal.

        IMPORTANT:
        Do not only print the result in the console.
        The game() function needs the returned value to update scores.
        */

        const WINNING_RULES = Object.freeze({
            Rock: "Scissors",
            Paper: "Rock",
            Scissors: "Paper"
        });

        function playRound(playerSelection, computerSelection) {

            if (typeof playerSelection !== "string" || typeof computerSelection !== "string") {
                return "draw";
            }

            const player = playerSelection.trim().toLowerCase();
            const computer = computerSelection.trim().toLowerCase();
            const toTitleCase = str => str.charAt(0).toUpperCase() + str.slice(1);

            // Recursive Step: Normalize unformatted inputs to canonical TitleCase
            if (playerSelection !== toTitleCase(player) || computerSelection !== toTitleCase(computer)) {
                return playRound(toTitleCase(player), toTitleCase(computer));
            }

            // Base Case 1: Draw condition
            if (playerSelection === computerSelection) {
                return "draw";
            }

            // Base Case 2: Win / Loss resolution via rule lookup
            return WINNING_RULES[playerSelection] === computerSelection
                ? "player"
                : "computer";
        }


        /*
        ============================================================
        ROBERTO'S SECTION: MAIN GAME FUNCTION
        ============================================================

        This is Roberto's main responsibility.

        The function:
        1. Initializes both scores.
        2. Explains the rules and how to open the console.
        3. Repeats rounds until someone reaches 3 points.
        4. Calls the functions written by the other teammates.
        5. Updates the scores according to each round's result.
        6. Announces the final winner.

        The three functions above must return the agreed values
        for this function to work correctly.
        */

        function game() {

            let playerScore = 0;
            let computerScore = 0;

            // Explain the rules before the first round.
            alert(
                "Welcome to Rock, Paper, Scissors!\n\n" +
                "You will play against the Evil AI.\n" +
                "The first player to win 3 rounds wins the game.\n\n" +
                "The results and scores will appear in the browser console.\n\n" +
                "To open the console in Chrome:\n" +
                "Windows: press F12 or Ctrl + Shift + J.\n" +
                "Mac: press Cmd + Option + J.\n\n" +
                "Press OK to start!"
            );

            console.clear();

            console.log(
                "=== ROCK, PAPER, SCISSORS VS THE EVIL AI ==="
            );

            console.log(
                "First to 3 points wins. Draws award no points."
            );

            console.log("----------------------------------------");

            // Continue playing while neither player has reached 3 points.
            while (playerScore < 3 && computerScore < 3) {

                // Get the player's choice.
                const playerSelection = getPlayerSelection();

                // End the game safely if the player cancels.
                if (playerSelection === null) {

                    console.log("The player cancelled the game.");

                    alert(
                        "The game has been cancelled. Thanks for playing!"
                    );

                    return;
                }

                // Get the computer's random choice.
                const computerSelection = computerPlay();

                // Determine the winner of the current round.
                const result = playRound(
                    playerSelection,
                    computerSelection
                );

                console.log("You chose: " + playerSelection);

                console.log(
                    "The Evil AI chose: " + computerSelection
                );

                // Update the scores according to the round result.
                if (result === "player") {

                    playerScore++;

                    console.log("You won this round!");

                } else if (result === "computer") {

                    computerScore++;

                    console.log("The Evil AI won this round!");

                } else if (result === "draw") {

                    console.log(
                        "It's a draw! No points awarded."
                    );

                } else {

                    // Handle an unexpected return value.
                    console.error(
                        "Unexpected result from playRound():",
                        result
                    );

                    alert(
                        "An error occurred. Please check the console."
                    );

                    return;
                }

                // Display the updated score after every round.
                console.log(
                    "Score | You: " + playerScore +
                    " - Evil AI: " + computerScore
                );

                console.log("----------------------------------------");
            }

            // Announce the final winner.
            if (playerScore === 3) {

                console.log(
                    "Congratulations! You defeated the Evil AI!"
                );

                alert(
                    "Congratulations! You defeated the Evil AI!"
                );

            } else {

                console.log(
                    "The Evil AI has won! Better luck next time!"
                );

                alert(
                    "The Evil AI has won! Better luck next time!"
                );
            }
        }


        /*
        ============================================================
        START THE GAME
        ============================================================

        The game starts automatically when the browser loads this page.
        */

        game();

    </script>

</body>

</html>
